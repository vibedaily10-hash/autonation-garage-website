<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F0F13">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | AutoNation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #0F0F13;
            color: #F5F5F7;
            font-family: Inter, system-ui, sans-serif;
            text-align: center;
        }
        main { max-width: 36rem; }
        .logo { margin-bottom: 2.5rem; font-size: 1.5rem; font-weight: 800; }
        .logo span, .status { color: #D4AF37; }
        .status { font-size: 0.875rem; font-weight: 700; text-transform: uppercase; }
        h1 { margin: 0.75rem 0 1rem; font-size: clamp(2rem, 8vw, 4rem); line-height: 1.1; }
        p { margin: 0 auto 2rem; max-width: 32rem; color: #A1A1A6; line-height: 1.7; }
        a {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: #118445;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        a:focus-visible { outline: 3px solid #D4AF37; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="logo">auto<span>Nation</span></div>
        <div class="status">404 error</div>
        <h1>Page not found</h1>
        <p>The page may have moved or the address may be incorrect. Return to AutoNation to continue browsing our services and marketplace.</p>
        <a href="index.html">Return to homepage</a>
    </main>
</body>
</html>
